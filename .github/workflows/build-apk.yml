name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Prepare build environment
        run: |
          # 1. Ensure .env and .env.example exist with valid non-empty values
          if [ ! -f .env.example ]; then
            echo 'GEMINI_API_KEY="DEFAULT_GEMINI_API_KEY"' > .env.example
          fi
          if [ ! -f .env ] || [ ! -s .env ]; then
            echo 'GEMINI_API_KEY="DEFAULT_GEMINI_API_KEY"' > .env
          fi

          # 2. Decode debug.keystore from base64 safely if present
          if [ -f debug.keystore.base64 ]; then
            cat debug.keystore.base64 | tr -d '\r\n ' | base64 -d > debug.keystore || true
          fi

          # 3. Ensure gradlew is executable
          chmod +x ./gradlew || true

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Xmx4096m -Dfile.encoding=UTF-8 -Djava.awt.headless=true"
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gvone-browser-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

