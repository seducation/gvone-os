name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Prepare Environment & Keystore
        run: |
          # 1. Environment file
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          # 2. Decode debug.keystore from base64 if present, else generate fresh with keytool
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || base64 --decode debug.keystore.base64 > debug.keystore || true
          fi
          
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "Generating debug.keystore via keytool..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        env:
          _JAVA_OPTIONS: "-Djava.awt.headless=true"
          JAVA_OPTS: "-Djava.awt.headless=true -Xmx4096m"
          GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.jvmargs='-Xmx4096m -Djava.awt.headless=true' -Dksp.useKSP2=true"
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gvone-browser-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
