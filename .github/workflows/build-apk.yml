name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare build environment
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

          # If gradle-wrapper.jar was omitted from git commit, regenerate it using installed Gradle
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar not found, generating wrapper..."
            gradle wrapper --gradle-version 9.3.1
          fi

          echo 'GEMINI_API_KEY="DEFAULT_GEMINI_API_KEY"' > .env.example
          echo 'GEMINI_API_KEY="DEFAULT_GEMINI_API_KEY"' > .env

          if [ -f debug.keystore.base64 ]; then
            cat debug.keystore.base64 | tr -d '\r\n ' | base64 -d > debug.keystore || true
          fi

          chmod +x ./gradlew || true

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gvone-browser-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

