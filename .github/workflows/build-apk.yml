name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          mkdir -p "${HOME}/.android"
          touch "${HOME}/.android/repositories.cfg"

          # Accept SDK licenses
          yes | sdkmanager --licenses || true

          # Install target platforms and build tools
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Prepare build environment
        run: |
          # 1. Ensure .env and .env.example exist
          if [ ! -f .env.example ]; then
            touch .env.example
          fi
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi

          # 2. Decode debug.keystore from base64 safely if present
          if [ -f debug.keystore.base64 ]; then
            cat debug.keystore.base64 | tr -d '\r\n ' | base64 -d > debug.keystore || true
          fi

          # 3. Fallback: generate fresh keystore if missing or empty
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "Generating fresh debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 4. Ensure gradlew is executable
          chmod +x ./gradlew || true

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Xmx4096m -Dfile.encoding=UTF-8 -Djava.awt.headless=true"
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gvone-browser-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

